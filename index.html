        let currentLevel = 1;
        let foundErrors = {};

        function loadLevel(level) {
            currentLevel = level;
            const levelData = gameDatabase[level];

            if (!levelData) return;

            // Update image
            const img = document.getElementById('gameImage');
            img.src = levelData.image;
            img.style.display = 'block';
            document.getElementById('imageError').style.display = 'none';

            // Add error handler for image loading
            img.onerror = function() {
                this.style.display = 'none';
                document.getElementById('imageError').style.display = 'block';
            };

            // Update info
            document.getElementById('levelTheme').textContent = levelData.thema;
            document.getElementById('levelDescription').textContent = levelData.datum;

            const articleLink = document.getElementById('articleLink');
            if (levelData.url) {
                articleLink.href = levelData.url;
                articleLink.style.display = 'block';
            }

            // Update error boxes
            updateErrorBoxes(level);

            // Update progress
            updateProgress();

            // Update buttons
            document.getElementById('btnPrev').disabled = level === 1;
            document.getElementById('btnNext').disabled = level === 66;

            // Update level info
            document.getElementById('levelInfo').textContent = `Level ${level} von 66`;

            // Initialize found errors for this level
            if (!foundErrors[level]) {
                foundErrors[level] = [false, false];
            }

            // Position hitboxes
            setTimeout(setupHitboxes, 100, level);
        }

        function setupHitboxes(level) {
            const levelData = gameDatabase[level];
            const container = document.querySelector('.image-panel');
            const img = document.getElementById('gameImage');

            // Remove old hitboxes
            document.querySelectorAll('.hitbox-circle').forEach(el => el.remove());

            if (!img.complete || !levelData.errors.length) return;

            const rect = img.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            levelData.errors.forEach((error, idx) => {
                const hitbox = document.createElement('div');
                hitbox.className = 'hitbox-circle';

                const scaleX = rect.width / img.naturalWidth;
                const scaleY = rect.height / img.naturalHeight;

                const x = rect.left - containerRect.left + (error.x * scaleX) - 25;
                const y = rect.top - containerRect.top + (error.y * scaleY) - 25;

                hitbox.style.left = x + 'px';
                hitbox.style.top = y + 'px';
                hitbox.textContent = idx + 1;
                hitbox.onclick = () => clickError(level, idx);

                if (foundErrors[level] && foundErrors[level][idx]) {
                    hitbox.classList.add('found');
                }

                container.appendChild(hitbox);
            });
        }

        function initMagnifyingGlass() {
                const glass = document.getElementById('magnifyingGlass');
                const container = document.querySelector('.image-panel');
                const img = document.getElementById('gameImage');

        if (!img.src) {
                glass.style.display = 'none';
                return;
        }
          
        glass.style.display = 'block';
        glass.style.left = container.offsetWidth / 2 - 40 + 'px';
        glass.style.top = container.offsetHeight / 2 - 40 + 'px';

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

glass.addEventListener('mousedown', (e) => {
  isDragging = true;
  offsetX = e.clientX - glass.getBoundingClientRect().left;
  offsetY = e.clientY - glass.getBoundingClientRect().top;
  glass.style.cursor = 'grabbing';
});

        glass.addEventListener('mousemove', (e) => {
         if (isDragging) {
         const rect = container.getBoundingClientRect();
         glass.style.left = (e.clientX - rect.left - offsetX) + 'px';
         glass.style.top = (e.clientY - rect.top - offsetY) + 'px';
        }
       });

document.addEventListener('mouseup', () => {
  isDragging = false;
  glass.style.cursor = 'grab';
});       

        function clickError(level, errorIdx) {
            if (!foundErrors[level]) foundErrors[level] = [false, false];
            foundErrors[level][errorIdx] = true;

            const hitboxes = document.querySelectorAll('.hitbox-circle');
            if (hitboxes[errorIdx]) {
                hitboxes[errorIdx].classList.add('found');
            }

            updateErrorBoxes(level);
            updateProgress();
            saveProgress();
        }

        function updateErrorBoxes(level) {
            if (!foundErrors[level]) foundErrors[level] = [false, false];

            for (let i = 0; i < 2; i++) {
                const box = document.getElementById(`error${i + 1}`);
                const status = box.querySelector('.error-status');
                if (foundErrors[level][i]) {
                    box.classList.add('found');
                    status.textContent = '✅';
                } else {
                    box.classList.remove('found');
                    status.textContent = '❌';
                }
            }
        }

        function updateProgress() {
            let total = 0;
            let found = 0;
            for (let level = 1; level <= 66; level++) {
                total += 2;
                if (foundErrors[level]) {
                    found += foundErrors[level].filter(x => x).length;
                }
            }

            const progress = (found / total) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Level ${currentLevel}/66 | ${found}/${total} Fehler`;
        }

        function nextLevel() {
            if (currentLevel < 66) {
                loadLevel(currentLevel + 1);
                saveProgress();
            }
        }

        function previousLevel() {
            if (currentLevel > 1) {
                loadLevel(currentLevel - 1);
                saveProgress();
            }
        }

        function saveProgress() {
            localStorage.setItem('fdfProgress', JSON.stringify({
                level: currentLevel,
                errors: foundErrors
            }));
        }

        function loadProgress() {
            const saved = localStorage.getItem('fdfProgress');
            if (saved) {
                const data = JSON.parse(saved);
                currentLevel = data.level || 1;
                foundErrors = data.errors || {};
            }
        }

        // Initialize
        loadProgress();
        loadLevel(currentLevel);
    </script>
